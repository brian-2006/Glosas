
services:

  db:
    image: postgres:16

    container_name: database

    restart: always

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./BackEnd

    container_name: glosas_backend

    restart: always

    ports:
      - "8000:8000"

    depends_on:
      - db

    volumes:
      - ./BackEnd:/BackEnd

    env_file:
      - ./.env

  frontend:
    build: ./FrontEnd

    container_name: glosas_frontend

    restart: always

    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --force"

    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

    ports:
      - "5173:5173"

    depends_on:
      - backend

    volumes:
      - ./FrontEnd:/FrontEnd
      - /FrontEnd/node_modules

    env_file:
      - ./.env

volumes:
  postgres_data: